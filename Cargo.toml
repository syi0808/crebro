[package]
name = "crebro"
version = "0.1.0"
edition = "2024"
description = "Local credential broker for coding agents that redacts secrets before LLM provider requests."
license = "Apache-2.0"
repository = "https://github.com/syi0808/crebro"
readme = "README.md"
keywords = ["credentials", "proxy", "llm", "redaction", "security"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aho-corasick = "1"
axum = "0.8"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
regex = "1"
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
zeroize = { version = "1", features = ["derive"] }

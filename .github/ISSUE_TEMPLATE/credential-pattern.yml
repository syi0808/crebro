name: Credential pattern
description: Suggest a credential pattern for Crebro to detect.
title: "Add credential pattern: "
body:
  - type: markdown
    attributes:
      value: |
        Suggest a credential pattern that Crebro should detect.

        Do not include real API keys, tokens, passwords, private keys, credential-bearing URLs, logs, or screenshots containing secrets.
  - type: input
    id: credential-name
    attributes:
      label: Credential name
      placeholder: Example API key
    validations:
      required: true
  - type: input
    id: service-name
    attributes:
      label: Related service name
      placeholder: Example
    validations:
      required: true
  - type: input
    id: service-link
    attributes:
      label: Related service link
      description: Link public documentation or a service page for the credential.
      placeholder: https://example.com/docs/api-keys
    validations:
      required: true
  - type: textarea
    id: credential-pattern
    attributes:
      label: Credential pattern regex or safe example
      description: Provide a regex, a public documented format, or fake examples only.
      placeholder: |
        Regex: example_[A-Za-z0-9]{32}
        Safe example: example_abcdefghijklmnopqrstuvwxyz123456
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I have not included real credentials, logs, packet captures, or screenshots containing secrets.
          required: true

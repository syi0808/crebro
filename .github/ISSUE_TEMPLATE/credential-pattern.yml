name: Credential pattern addition
description: Propose a new or changed built-in credential detection pattern.
title: "Add credential pattern: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template before opening a pull request that adds or changes a built-in credential pattern.

        Do not include real API keys, tokens, passwords, private keys, credential-bearing URLs, packet captures, or logs.
  - type: input
    id: credential-family
    attributes:
      label: Credential family
      description: Name the provider, product, protocol, or credential family.
      placeholder: Example provider access token
    validations:
      required: true
  - type: textarea
    id: detection-goal
    attributes:
      label: Detection goal
      description: Explain what Crebro should detect and why the existing rules are not enough.
    validations:
      required: true
  - type: dropdown
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Choose the safest expected `on_unregistered_match` behavior.
      options:
        - auto_redact
        - require_explicit_secret
        - allow
    validations:
      required: true
  - type: textarea
    id: public-references
    attributes:
      label: Public references
      description: Link public documentation or other non-secret references for the credential format.
      placeholder: |
        - Provider docs:
        - Public format reference:
    validations:
      required: true
  - type: textarea
    id: synthetic-positive-examples
    attributes:
      label: Safe synthetic examples that should match
      description: Provide fake values only. Do not paste real credentials.
      placeholder: |
        - provider_test_abcdefghijklmnopqrstuvwxyz123456
        - PROVIDER_TOKEN=abcdefghijklmnopqrstuvwxyz123456
    validations:
      required: true
  - type: textarea
    id: negative-examples
    attributes:
      label: Examples that should not match
      description: Include likely false positives, public identifiers, placeholders, short values, or documentation examples.
      placeholder: |
        - provider_public_identifier_123
        - your_provider_token_here
    validations:
      required: true
  - type: textarea
    id: security-analysis
    attributes:
      label: Security and false-positive analysis
      description: Describe why this should redact, block, or allow, and what risk remains.
    validations:
      required: true
  - type: textarea
    id: testing-plan
    attributes:
      label: Testing plan
      description: List the tests that should be added or updated.
      placeholder: |
        - Add positive and negative cases in tests/redaction_cache.rs.
        - Add runtime coverage if proxy, gateway, or stats behavior changes.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have not included real credentials, logs, packet captures, or screenshots containing secrets.
          required: true
        - label: I understand that a linked issue is required before opening a pull request that adds or changes a built-in credential pattern.
          required: true

[env]
key_markers = [
  "KEY",
  "TOKEN",
  "SECRET",
  "PASSWORD",
  "PASS",
  "AUTH",
  "CREDENTIAL",
  "PRIVATE",
  "CERT",
  "DATABASE_URL",
  "CONNECTION_STRING",
]

common_values = [
  "true",
  "false",
  "debug",
  "development",
  "production",
  "test",
  "localhost",
  "127.0.0.1",
]

min_value_len = 12
min_entropy = 3.0

[[credential_patterns]]
id = "github_token"
description = "GitHub token-like value"
regex = '''\bgh[pousr]_[A-Za-z0-9_]{20,}\b'''
on_unregistered_match = "require_explicit_secret"

[[credential_patterns]]
id = "anthropic_key"
description = "Anthropic API key-like value"
regex = '''\bsk-ant-[A-Za-z0-9_-]{20,}\b'''
on_unregistered_match = "require_explicit_secret"

[[credential_patterns]]
id = "openai_key"
description = "OpenAI API key-like value"
regex = '''\bsk-[A-Za-z0-9_-]{20,}\b'''
on_unregistered_match = "require_explicit_secret"

[[credential_patterns]]
id = "aws_access_key_id"
description = "AWS access key id-like value"
regex = '''\bA(KIA|SIA)[0-9A-Z]{16}\b'''
on_unregistered_match = "require_explicit_secret"

[[credential_patterns]]
id = "slack_token"
description = "Slack token-like value"
regex = '''\bxox[baprs]-[A-Za-z0-9-]{20,}\b'''
on_unregistered_match = "require_explicit_secret"
